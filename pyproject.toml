[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire-responder"
version = "1.0.0"
description = "Grounded answers to security and AI due-diligence questionnaires: LangGraph + Claude + Jev, with human review."
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "langchain-anthropic",
    "typesafe-sdk",
    "openpyxl",
    "pandas",
]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
